[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostgate"
version = "1.0.0"
description = "The Zero-Trust Security Infrastructure for the Autonomous AI Era"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "GhostGate Labs" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "rich>=13.7.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostgate_core*", "rawhuman_engine*"]
exclude = ["recipes*", "tests*", "benchmarks*"]

[project.scripts]
ghostgate = "ghostgate_core.cli:main"
ghostgate-proxy = "ghostgate_core.proxy:main"
rawhuman = "rawhuman_engine.server:main"
rawhuman-demo = "rawhuman_engine.demo_cli:main"

[tool.vercel]
entrypoint = "ghostgate_core.proxy:app"
